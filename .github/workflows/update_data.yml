name: Live Data Auto Updater

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Script-Datei erstellen
      run: |
        cat << 'EOF' > fetch_data.py
        import urllib.request, json, datetime, xml.etree.ElementTree as ET, re
        data = {"currencies": {"EUR": "37.45", "EUR_trend": "→", "DKK": "5.02", "DKK_trend": "→", "NOK": "3.22", "NOK_trend": "→", "USD": "34.50", "USD_trend": "→", "AUD": "22.80", "AUD_trend": "→", "RUB": "0.38", "RUB_trend": "→"}, "weather": {"temp": "32", "feels_like": "37", "wind_speed": "15", "wind_dir": "SW", "aqi_value": "35", "aqi_status": "Good", "aqi_color": "#00e676"}, "alert": {"active": False, "message": ""}, "news": ["ROS KILDE: Portal initializing..."], "flights": []}
        try:
            with open("roskilde_data.json", "r", encoding="utf-8") as f:
                old = json.load(f)
                if "currencies" in old: old_c = old["currencies"]
                else: old_c = {}
        except: old_c = {}
        try:
            r = json.loads(urllib.request.urlopen("https://open.er-api.com/v6/latest/THB", timeout=10).read().decode())["rates"]
            for t in ["EUR", "DKK", "NOK", "USD", "AUD", "RUB"]:
                val = 1/r[t]; data["currencies"][t] = f"{val:.2f}"
                old_v = float(old_c.get(t, val))
                data["currencies"][t+"_trend"] = "↑" if val > old_v + 0.005 else ("↓" if val < old_v - 0.005 else "→")
        except: pass
        try:
            w = json.loads(urllib.request.urlopen("https://api.open-meteo.com/v1/forecast?latitude=12.933&longitude=100.883&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m&air_quality=us_aqi", timeout=10).read().decode())["current"]
            data["weather"].update({"temp": str(round(w['temperature_2m'])), "feels_like": str(round(w['apparent_temperature'])), "wind_speed": str(round(w['wind_speed_10m']))})
        except: pass
        try:
            g = ET.fromstring(urllib.request.urlopen("https://www.gdacs.org/xml/rss.xml", timeout=10).read())
            for item in g.findall('.//item'):
                if "Thailand" in (item.find('title').text or ""):
                    data["alert"] = {"active": True, "message": "🚨 ALERT: " + item.find('title').text}
            n = ET.fromstring(urllib.request.urlopen("https://news.google.com/rss/search?q=Pattaya+Thailand&hl=en-TH&gl=TH&ceid=TH:en", timeout=10).read())
            data["news"] = [re.sub(r'\s-\s.*', '', i.find("title").text) for i in n.findall(".//item")[:5]]
        except: pass
        data["last_update"] = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
        with open("roskilde_data.json", "w", encoding="utf-8") as f: json.dump(data, f, ensure_ascii=False, indent=2)
        EOF

    - name: Script ausführen
      run: python fetch_data.py

    - name: Änderungen pushen
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add roskilde_data.json
        git commit -m "Automatisches Update" || echo "Keine Änderungen"
        git push
