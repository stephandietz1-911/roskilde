name: Live Data Auto Updater

on:
  schedule:
    - cron: '0 * * * *' # Läuft vollautomatisch jede Stunde
  workflow_dispatch: # Erlaubt jederzeit den manuellen Start

jobs:
  update-json:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Daten aus dem Internet abrufen
      run: |
        python -c "
        import urllib.request
        import json
        import datetime

        # Standard-Struktur aufbauen
        data = {
            'currencies': {'EUR': '37.45', 'DKK': '5.02', 'NOK': '3.22'},
            'weather': {'wind_speed': '15', 'wind_dir': 'SW', 'aqi_value': '35', 'aqi_status': 'Good', 'aqi_color': '#00e676'},
            'alert': {'active': False, 'message': ''},
            'news': [],
            'flights': []
        }

        # 1. Bestehende lokale Datei laden (um Flüge, News und manuellen Alarm zu erhalten!)
        try:
            with open('roskilde_data.json', 'r', encoding='utf-8') as f:
                local_data = json.load(f)
                if 'alert' in local_data: data['alert'] = local_data['alert']
                if 'news' in local_data and local_data['news']: data['news'] = local_data['news']
                if 'flights' in local_data and local_data['flights']: data['flights'] = local_data['flights']
        except Exception as e:
            print('Hinweis: Konnte bestehende JSON nicht lesen, erstelle neu.', e)

        # 2. ECHTE LIVE-WECHSELKURSE HOLEN (API von er-api.com)
        try:
            req = urllib.request.Request('https://open.er-api.com/v6/latest/THB', headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req, timeout=10) as response:
                rates_data = json.loads(response.read().decode())
                if rates_data and 'rates' in rates_data:
                    # Da Basis THB ist, rechnen wir 1 / Kurs, um EUR/THB zu bekommen
                    data['currencies']['EUR'] = f\"{1 / rates_data['rates']['EUR']:.2f}\"
                    data['currencies']['DKK'] = f\"{1 / rates_data['rates']['DKK']:.2f}\"
                    data['currencies']['NOK'] = f\"{1 / rates_data['rates']['NOK']:.2f}\"
                    print('Wechselkurse erfolgreich live aktualisiert.')
        except Exception as e:
            print('Fehler beim Abruf der Wechselkurse:', e)

        # 3. ECHTES WETTER & AQI FÜR PATTAYA HOLEN (Open-Meteo API)
        try:
            # Koordinaten für Pattaya: Lat 12.933, Lon 100.883
            weather_url = 'https://api.open-meteo.com/v1/forecast?latitude=12.933&longitude=100.883&current=wind_speed_10m,wind_direction_10m&air_quality=us_aqi&timezone=Asia%2FBangkok'
            req = urllib.request.Request(weather_url, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req, timeout=10) as response:
                w_data = json.loads(response.read().decode())
                if 'current' in w_data:
                    data['weather']['wind_speed'] = f\"{round(w_data['current']['wind_speed_10m'])}\"
                    
                    # Windrichtung Grad in Text umwandeln
                    deg = w_data['current']['wind_direction_10m']
                    dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW']
                    data['weather']['wind_dir'] = dirs[round(((deg % 360) / 45)) % 8]
                    
                    # AQI (falls verfügbar, sonst Standard)
                    if 'air_quality' in w_data and 'us_aqi' in w_data['air_quality']:
                        aqi = int(w_data['air_quality']['us_aqi'])
                        data['weather']['aqi_value'] = str(aqi)
                        if aqi <= 50:
                            data['weather']['aqi_status'], data['weather']['aqi_color'] = 'Good', '#00e676'
                        elif aqi <= 100:
                            data['weather']['aqi_status'], data['weather']['aqi_color'] = 'Moderate', '#ffeb3b'
                        else:
                            data['weather']['aqi_status'], data['weather']['aqi_color'] = 'Unhealthy', '#ff5722'
                    print('Wetter & AQI erfolgreich live aktualisiert.')
        except Exception as e:
            print('Fehler beim Abruf des Wetters:', e)

        # Zeitstempel setzen
        data['last_update'] = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')

        # 4. In roskilde_data.json schreiben
        with open('roskilde_data.json', 'w', encoding='utf-8') as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
        "

    - name: Änderungen zurückpushen
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.name 'github-actions[bot]'
        git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add roskilde_data.json
        
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m '🤖 Automatisches Live-Daten Update'
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          echo "Erfolgreich ins Repo gepusht!"
        else
          echo "Keine Änderungen vorhanden."
        fi
