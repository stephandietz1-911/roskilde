# 4. Google News (Pattaya Suche) statt thepattayanews
        try:
            # Google News RSS Feed Suche nach Pattaya
            news_url = "https://news.google.com/rss/search?q=Pattaya+Thailand&hl=en-TH&gl=TH&ceid=TH:en"
            req = urllib.request.Request(news_url, headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(req, timeout=12) as response:
                root = ET.fromstring(response.read())
                titles = []
                for item in root.findall(".//item")[:5]:
                    title_text = item.find("title").text if item.find("title") is not None else ""
                    # Bereinigen von Source-Tags
                    t_clean = re.sub(r'\s-\s.*', '', title_text).strip()
                    if t_clean: titles.append(f"PATTAYA: {t_clean}")
                if titles: data["news"] = titles
                else: data["news"] = ["PATTAYA: Check back later for live updates."]
        except Exception as e:
            print("Fehler bei Google News:", e)
