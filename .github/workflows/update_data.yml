name: Live Data Auto Updater

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4.1.7

    - name: Python installieren
      uses: actions/setup-python@v5.1.1
      with:
        python-version: '3.12'

    - name: Script-Datei erstellen
      run: |
        cat << 'EOF' > fetch_data.py
        import urllib.request, json, datetime, xml.etree.ElementTree as ET, re

        data = {
            "currencies": {"EUR": "37.45", "EUR_trend": "→", "DKK": "5.02", "DKK_trend": "→", "NOK": "3.22", "NOK_trend": "→", "USD": "34.50", "USD_trend": "→", "AUD": "22.80", "AUD_trend": "→", "RUB": "0.38", "RUB_trend": "→", "BTC": "2,000,000", "BTC_trend": "→"},
            "weather": {"temp": "32", "feels_like": "37", "wind_speed": "15", "wind_dir": "SW", "aqi_value": "35", "aqi_status": "Good", "aqi_color": "#10b981", "uv_index": "0.0"},
            "alert": {"active": False, "message": ""},
            "news": ["ROS KILDE: Welcome to our Infotainment Portal."],
            "flights": [],
            "history": {}
        }

        # 1. Alte Daten laden
        try:
            with open("roskilde_data.json", "r", encoding="utf-8") as f:
                old_data = json.load(f)
                old_currencies = old_data.get("currencies", {})
        except:
            old_currencies = {}

        # 2. Live-Wechselkurse (Fiat)
        try:
            req = urllib.request.Request("https://open.er-api.com/v6/latest/THB", headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(req, timeout=10) as response:
                rates = json.loads(response.read().decode())["rates"]
                for t in ["EUR", "DKK", "NOK", "USD", "AUD", "RUB"]:
                    val = 1/rates[t]
                    data["currencies"][t] = f"{val:.2f}"
                    old = float(old_currencies.get(t, val))
                    data["currencies"][t+"_trend"] = "↑" if val > old + 0.005 else ("↓" if val < old - 0.005 else "→")
        except: pass

        # 3a. 90-Tage Historie für Fiat-Diagramm abfragen (Frankfurter API)
        try:
            end_d = datetime.date.today()
            start_d = end_d - datetime.timedelta(days=90)
            f_url = f"https://api.frankfurter.app/{start_d}..{end_d}?from=EUR&to=THB,USD,DKK,NOK,AUD"
            req = urllib.request.Request(f_url, headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(req, timeout=10) as response:
                r_data = json.loads(response.read().decode())["rates"]
                sorted_dates = sorted(r_data.keys())
                h_eur, h_usd, h_dkk, h_nok, h_aud = [], [], [], [], []
                
                for d in sorted_dates:
                    dr = r_data[d]
                    if "THB" not in dr: continue
                    thb = dr["THB"]
                    h_eur.append(round(thb, 4))
                    if "USD" in dr: h_usd.append(round(thb / dr["USD"], 4))
                    if "DKK" in dr: h_dkk.append(round(thb / dr["DKK"], 4))
                    if "NOK" in dr: h_nok.append(round(thb / dr["NOK"], 4))
                    if "AUD" in dr: h_aud.append(round(thb / dr["AUD"], 4))
                    
                data["history"] = {"EUR": h_eur, "USD": h_usd, "DKK": h_dkk, "NOK": h_nok, "AUD": h_aud, "RUB": []}
        except Exception as e:
            print("Fiat History error:", e)

        # 3b. Bitcoin (BTC) Live & Historie (über CoinGecko API, 30 Tage)
        try:
            cg_url = "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=thb&days=30&interval=daily"
            cg_req = urllib.request.Request(cg_url, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})
            with urllib.request.urlopen(cg_req, timeout=10) as response:
                cg_data = json.loads(response.read().decode())
                prices = [round(p[1]) for p in cg_data.get("prices", [])]
                
                if prices:
                    current_btc = prices[-1]
                    old_btc = prices[-2] if len(prices) > 1 else current_btc
                    
                    # Formatierung mit Tausendertrennzeichen, z.B. "2,245,600"
                    data["currencies"]["BTC"] = f"{current_btc:,.0f}"
                    data["currencies"]["BTC_trend"] = "↑" if current_btc > old_btc else ("↓" if current_btc < old_btc else "→")
                    data["history"]["BTC"] = prices
        except Exception as e:
            print("BTC error:", e)

        # 4. Wetter & UV-Index
        try:
            w_url = "https://api.open-meteo.com/v1/forecast?latitude=12.923&longitude=100.883&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,uv_index"
            req = urllib.request.Request(w_url, headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(req, timeout=10) as response:
                w_data = json.loads(response.read().decode())["current"]
                deg = w_data.get('wind_direction_10m', 0)
                dirs = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"]
                w_dir_text = dirs[int((deg + 11.25) / 22.5) % 16]

                data["weather"].update({
                    "temp": str(round(w_data.get('temperature_2m', 0))),
                    "feels_like": str(round(w_data.get('apparent_temperature', 0))),
                    "wind_speed": str(round(w_data.get('wind_speed_10m', 0))),
                    "wind_dir": w_dir_text,
                    "uv_index": str(round(w_data.get('uv_index', 0.0), 1))
                })
        except: pass

        # 5. Luftqualität (AQI)
        try:
            aqi_url = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=12.923&longitude=100.883&current=us_aqi"
            req_aqi = urllib.request.Request(aqi_url, headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(req_aqi, timeout=10) as response:
                aqi_data = json.loads(response.read().decode())["current"]
                aqi = aqi_data.get('us_aqi', 35)
                aqi_status, aqi_color = ("Good", "#10b981") if aqi <= 50 else (("Moderate", "#f59e0b") if aqi <= 100 else ("Unhealthy", "#ef4444"))
                
                data["weather"].update({"aqi_value": str(aqi), "aqi_status": aqi_status, "aqi_color": aqi_color})
        except: pass

        # 6. News bereinigt
        try:
            n_req = urllib.request.Request("https://news.google.com/rss/search?q=Pattaya+Thailand&hl=en-TH&gl=TH&ceid=TH:en", headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(n_req, timeout=10) as response:
                root = ET.fromstring(response.read())
                clean_titles = []
                for item in root.findall(".//item")[:5]:
                    title = item.find("title").text or ""
                    title = re.sub(r'\s-\s.*', '', title)
                    title = re.sub(r'\s\([a-zA-Z0-9]{10}\)$', '', title).strip()
                    if title: clean_titles.append(title)
                if clean_titles: data["news"] = clean_titles
        except: pass

        # 7. Wetterwarnungen (TMD)
        alert_active = False
        alert_msg = ""
        try:
            tmd_url = "https://data.tmd.go.th/api/WeatherWarningV2/DataIn_RSS_Feed?uid=api&ukey=api"
            tmd_req = urllib.request.Request(tmd_url, headers={"User-Agent": "Mozilla/5.0"})
            with urllib.request.urlopen(tmd_req, timeout=10) as response:
                tmd_root = ET.fromstring(response.read())
                for item in tmd_root.findall('.//item'):
                    title = item.find('title').text or ""
                    desc = item.find('description').text or ""
                    if any(x in title or x in desc for x in ["Chonburi", "Pattaya", "Eastern", "Gulf of Thailand", "Heavy Rain"]):
                        alert_active = True
                        alert_msg = "⛈️ WEATHER ALERT: " + (title if len(title) < 60 else title[:57] + "...")
                        break
        except: pass

        data["alert"] = {"active": alert_active, "message": alert_msg}

        # 8. Flüge erhalten
        try:
            if 'old_data' in locals() and "flights" in old_data: data["flights"] = old_data["flights"]
        except: pass

        data["last_update"] = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
        with open("roskilde_data.json", "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
        EOF

    - name: Script ausführen
      run: python fetch_data.py

    - name: Änderungen pushen
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add roskilde_data.json
        git commit -m "Daten-Update: Historie für Chart und BTC hinzugefügt" || echo "Keine Änderungen"
        git push
