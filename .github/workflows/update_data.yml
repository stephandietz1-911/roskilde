name: Live Data Auto Updater

on:
  schedule:
    - cron: '0 * * * *' # Läuft vollautomatisch jede Stunde
  workflow_dispatch: # Erlaubt es dir, den Update-Knopf jederzeit manuell zu drücken

jobs:
  update-json:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Daten aus dem Internet abrufen
      run: |
        python -c "
        import urllib.request
        import json
        import datetime

        try:
            # 1. Echte Live-Daten abrufen
            url = 'https://neeve.live/api/roskilde_data.json'
            req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req) as response:
                live_data = json.loads(response.read().decode())
            
            # 2. Lokalen Alarm-Status beibehalten
            try:
                with open('roskilde_data.json', 'r', encoding='utf-8') as f:
                    local_data = json.load(f)
                    if 'alert' in local_data and 'active' in local_data['alert']:
                        live_data['alert']['active'] = local_data['alert']['active']
            except:
                pass

            # HIER NEU: Ein garantierter Zeitstempel, damit Git IMMER eine Änderung sieht!
            # Das zeigt uns im File genau an, wann der Bot das letzte Mal da war.
            live_data['last_update'] = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')

            # 3. Abspeichern
            with open('roskilde_data.json', 'w', encoding='utf-8') as f:
                json.dump(live_data, f, ensure_ascii=False, indent=2)
            print('Daten erfolgreich lokal generiert!')
        except Exception as e:
            print('Fehler beim Abruf:', e)
        "

    - name: Änderungen zurückpushen
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.name 'github-actions[bot]'
        git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add roskilde_data.json
        
        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m '🤖 Automatisches Live-Daten Update'
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          echo "Erfolgreich ins Repo gepusht!"
        else
          echo "Keine Änderungen vorhanden."
        fi
