name: Live Data Auto Updater

on:
  schedule:
    - cron: '0 * * * *' # Läuft vollautomatisch jede Stunde
  workflow_dispatch: # Erlaubt es dir, den Update-Knopf jederzeit manuell zu drücken

jobs:
  update-json:
    runs-on: ubuntu-latest
    
    # HIER IST DER SCHLÜSSEL: Wir geben dem Bot explizit Schreibrechte für dieses Repository
    permissions:
      contents: write

    steps:
    # Upgrade auf v6 (unterstützt Node 24 nativ, Warnung ist weg)
    - name: Code auschecken
      uses: actions/checkout@v6

    # Upgrade auf v6 (unterstützt Node 24 nativ, Warnung ist weg)
    - name: Python installieren
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Daten aus dem Internet abrufen
      run: |
        python -c "
        import urllib.request
        import json

        try:
            # 1. Echte Live-Daten von der API abrufen
            url = 'https://neeve.live/api/roskilde_data.json'
            req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req) as response:
                live_data = json.loads(response.read().decode())
            
            # 2. Die bestehende lokale JSON-Datei laden (um den manuellen Alarm-Status zu behalten!)
            try:
                with open('roskilde_data.json', 'r', encoding='utf-8') as f:
                    local_data = json.load(f)
                    if 'alert' in local_data and 'active' in local_data['alert']:
                        live_data['alert']['active'] = local_data['alert']['active']
            except:
                pass

            # 3. Die Datei frisch abspeichern
            with open('roskilde_data.json', 'w', encoding='utf-8') as f:
                json.dump(live_data, f, ensure_ascii=False, indent=2)
            print('Daten erfolgreich aktualisiert!')
        except Exception as e:
            print('Fehler beim Abruf:', e)
        "

    - name: Änderungen zurück in dein GitHub Repository pushen
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add roskilde_data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 Automatisches Live-Daten Update' && git push)
