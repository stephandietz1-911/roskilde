import urllib.request
import xml.etree.ElementTree as ET
import json

def get_thailand_alerts():
    # Wir nutzen den offiziellen RSS-Feed von GDACS (Global Disaster Alert)
    url = "https://www.gdacs.org/xml/rss.xml"
    
    alert_active = False
    alert_message = ""
    
    try:
        # Feed abrufen
        response = urllib.request.urlopen(url, timeout=10)
        data = response.read()
        
        # XML parsen
        root = ET.fromstring(data)
        
        # Alle aktuellen Meldungen durchgehen
        for item in root.findall('.//item'):
            title = item.find('title').text if item.find('title') is not None else ""
            description = item.find('description').text if item.find('description') is not None else ""
            
            # Prüfen, ob Thailand in der Meldung erwähnt wird
            if "Thailand" in title or "Thailand" in description:
                # Nur schwere Warnungen (Red/Orange) oder Erdbeben/Flut-Meldungen filtern
                alert_active = True
                alert_message = f"ACHTUNG: {title}"
                break # Die erste wichtige Meldung reicht uns
                
    except Exception as e:
        print(f"Fehler beim Abruf der Katastrophenwarnungen: {e}")
        
    return {"active": alert_active, "message": alert_message}

