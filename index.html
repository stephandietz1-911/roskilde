<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ROS KILDE Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d0f12; color: #e2e8f0; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Der obere Header ist wieder da */
        header { 
            background: linear-gradient(90deg, #1a1f26 0%, #0d0f12 100%); 
            padding: 10px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid #00f2fe; 
            height: 70px; 
        }
        .logo-text h1 { font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 0 12px rgba(0, 242, 254, 0.6); margin: 0; }
        .logo-text h1 span { color: #00f2fe; }
        .tagline { font-size: 11px; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px; margin-top: 1px; }
        .header-title { font-size: 18px; color: #fff; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

        /* Main-Container berechnet jetzt die Header-Höhe mit ein */
        .main { display: flex; flex: 1; height: calc(100vh - 130px); overflow: hidden; }
        #windy { width: 63%; height: 100%; border: none; }
        
        .sidebar { width: 37%; padding: 15px; background: #12161c; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .widget { border-bottom: 2px solid #343e50; padding-bottom: 12px; }
        .widget:last-child { border-bottom: none; }
        .title { color: #00f2fe; font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
        
        .currency-row { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
        .val { font-weight: bold; color: #00e676; }
        
        .flight-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .flight-table td { padding: 6px 2px; border-bottom: 1px solid #2d3748; }
        
        .ticker { background: #00f2fe; color: #000; height: 60px; display: flex; align-items: center; padding-left: 20px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-text">
                <h1>ROS <span>KILDE</span></h1>
                <div class="tagline">Jomtien / Pattaya</div>
            </div>
        </div>
        <div class="header-title">Infotainment Portal</div>
    </header>

    <div class="main">
        <iframe id="windy" src="https://embed.windy.com/embed2.html?lat=12.923&lon=100.883&zoom=9&overlay=radar&autoplay=true&play=1"></iframe>
        <div class="sidebar">
            <div class="widget"><div class="title">💶 EXCHANGE RATES</div><div id="cur"></div></div>
            <div class="widget">
                <div class="title">🌡️ WEATHER & AIR QUALITY</div>
                <div id="wea" style="font-size: 14px; line-height: 1.6;"></div>
                <div id="aqi" style="font-size: 13px; margin-top:5px; color:#ffeb3b;"></div>
                <div id="ale" style="color:#ff003c; font-weight:bold; margin-top:10px;"></div>
            </div>
            <div class="widget"><div id="flt-t" class="title">✈️ FLIGHTS</div><table class="flight-table"><tbody id="flt-b"></tbody></table></div>
        </div>
    </div>
    <div id="ticker" class="ticker">Lade News...</div>

    <script>
        var gData = null; var fMode = "ARR"; var curB = 0;
        
        function update() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "roskilde_data.json?t=" + new Date().getTime(), true);
            xhr.onreadystatechange = function() {
                if(xhr.readyState == 4 && xhr.status == 200) {
                    gData = JSON.parse(xhr.responseText);
                    render();
                }
            };
            xhr.send();
        }

        function render() {
            if(!gData) return;
            // Währungen
            var cHtml = "";
            var keys = Object.keys(gData.currencies).filter(function(x){return !x.includes("trend")});
            var idx1 = (curB * 2) % keys.length;
            var idx2 = (curB * 2 + 1) % keys.length;
            cHtml += "<div class='currency-row'><span>"+keys[idx1]+"/THB</span><span class='val'>"+gData.currencies[keys[idx1]]+" "+gData.currencies[keys[idx1]+"_trend"]+"</span></div>";
            cHtml += "<div class='currency-row'><span>"+keys[idx2]+"/THB</span><span class='val'>"+gData.currencies[keys[idx2]]+" "+gData.currencies[keys[idx2]+"_trend"]+"</span></div>";
            document.getElementById('cur').innerHTML = cHtml;
            
            // Wetter
            document.getElementById('wea').innerHTML = "🌡️ " + gData.weather.temp + "°C (Gefühlt: " + gData.weather.feels_like + "°C)<br>💨 Wind: " + gData.weather.wind_speed + " km/h " + gData.weather.wind_dir;
            document.getElementById('aqi').innerText = "😷 Luftqualität (AQI): " + gData.weather.aqi_value + " (" + gData.weather.aqi_status + ")";
            document.getElementById('ale').innerText = gData.alert.active ? gData.alert.message : "";
            
            // Flüge
            document.getElementById('flt-t').innerText = "✈️ FLIGHTS (" + (fMode=="ARR" ? "ARRIVALS" : "DEPARTURES") + ")";
            var fHtml = "";
            for(var i=0; i<gData.flights.length; i++) {
                if(gData.flights[i].type == fMode) fHtml += "<tr><td>"+gData.flights[i].time+"</td><td>"+gData.flights[i].city+"</td><td>"+gData.flights[i].status+"</td></tr>";
            }
            document.getElementById('flt-b').innerHTML = fHtml;
        }

        // Intervalle
        setInterval(function() { curB = (curB + 1) % 3; render(); }, 10000);
        setInterval(function() { fMode = (fMode == "ARR") ? "DEP" : "ARR"; render(); }, 15000);
        setInterval(function() { if(gData) document.getElementById('ticker').innerText = gData.news[Math.floor(Math.random()*gData.news.length)]; }, 8000);
        
        // Radar Rotation
        setInterval(function() {
            var isPattaya = document.getElementById('windy').src.includes("12.923");
            var baseUrl = isPattaya ? "https://embed.windy.com/embed2.html?lat=13.000&lon=101.000&zoom=6" : "https://embed.windy.com/embed2.html?lat=12.923&lon=100.883&zoom=9";
            document.getElementById('windy').src = baseUrl + "&overlay=radar&autoplay=true&play=1&message=false&marker=false";
        }, 45000);
        
        setInterval(update, 20000);
        update();
    </script>
</body>
</html>
