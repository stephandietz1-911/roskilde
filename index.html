<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ROS KILDE - Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0d0f12; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        #windy { width: 65%; height: 100%; border: none; }
        .sidebar { width: 35%; background: #12161c; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .widget-title { color: #00f2fe; font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .currency-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
        .flight-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        .flight-table td { padding: 4px; border-bottom: 1px solid #2d3748; }
        .ticker { background: #00f2fe; color: #000; padding: 10px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="main-container">
        <iframe id="windy" src="https://embed.windy.com/embed2.html?lat=12.923&lon=100.883&zoom=9&overlay=radar"></iframe>
        <div class="sidebar">
            <div class="widget-title">💶 EXCHANGE RATES</div>
            <div id="currency-display-box"></div>
            <div class="widget-title" style="margin-top:15px">🌡️ WEATHER</div>
            <div id="weather-text" style="font-size:14px"></div>
            <div id="alert" style="color:#ff003c; font-weight:bold; margin-top:10px;"></div>
            <div id="flight-title" class="widget-title" style="margin-top:15px">✈️ FLIGHTS</div>
            <table class="flight-table"><tbody id="flight-table-body"></tbody></table>
        </div>
    </div>
    <div id="static-news-box" class="ticker">Lade News...</div>

    <script>
        var globalData = null;
        var currentFlightType = "ARR";
        var curBlock = 0;

        function load() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "roskilde_data.json?t=" + new Date().getTime(), true);
            xhr.onreadystatechange = function() {
                if(xhr.readyState == 4 && xhr.status == 200) {
                    globalData = JSON.parse(xhr.responseText);
                    render();
                }
            };
            xhr.send();
        }

        function render() {
            if(!globalData) return;
            // Währungen
            var cHtml = "";
            var keys = Object.keys(globalData.currencies).filter(k => !k.includes("trend"));
            var k1 = keys[curBlock*2], k2 = keys[curBlock*2+1];
            cHtml += "<div class='currency-row'><span>"+k1+"/THB</span><span>"+globalData.currencies[k1]+" "+globalData.currencies[k1+"_trend"]+"</span></div>";
            cHtml += "<div class='currency-row'><span>"+k2+"/THB</span><span>"+globalData.currencies[k2]+" "+globalData.currencies[k2+"_trend"]+"</span></div>";
            document.getElementById('currency-display-box').innerHTML = cHtml;
            // Wetter
            document.getElementById('weather-text').innerHTML = "🌡️ " + globalData.weather.temp + "°C (Gefühlt: " + globalData.weather.feels_like + "°C)<br>💨 Wind: " + globalData.weather.wind_speed + " km/h " + globalData.weather.wind_dir;
            if(globalData.alert.active) document.getElementById('alert').innerText = globalData.alert.message;
            // Flüge
            document.getElementById('flight-title').innerText = "✈️ FLIGHTS (" + (currentFlightType=="ARR" ? "ARRIVALS" : "DEPARTURES") + ")";
            var fHtml = "";
            for(var i=0; i<globalData.flights.length; i++) {
                var f = globalData.flights[i];
                if(f.type == currentFlightType) fHtml += "<tr><td>"+f.time+"</td><td>"+f.city+"</td><td>"+f.status+"</td></tr>";
            }
            document.getElementById('flight-table-body').innerHTML = fHtml;
        }

        // Radar-Rotation
        var showPattaya = true;
        setInterval(function() {
            document.getElementById('windy').src = showPattaya ? 
                "https://embed.windy.com/embed2.html?lat=13.000&lon=101.000&zoom=6&overlay=radar" : 
                "https://embed.windy.com/embed2.html?lat=12.923&lon=100.883&zoom=9&overlay=radar";
            showPattaya = !showPattaya;
        }, 45000);

        setInterval(function() { curBlock = (curBlock + 1) % 3; render(); }, 7000);
        setInterval(function() { currentFlightType = (currentFlightType == "ARR") ? "DEP" : "ARR"; render(); }, 15000);
        setInterval(function() { if(globalData) { var i = Math.floor(Math.random()*globalData.news.length); document.getElementById('static-news-box').innerText = globalData.news[i]; } }, 8000);
        setInterval(load, 20000);
        load();
    </script>
</body>
</html>
