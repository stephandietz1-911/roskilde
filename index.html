<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ROS KILDE</title>
    <style>
        body { background: #0d0f12; color: #fff; font-family: sans-serif; overflow: hidden; margin: 0; }
        .grid { display: flex; height: 90vh; }
        .sidebar { width: 35%; padding: 20px; }
        .ticker { height: 10vh; background: #00f2fe; color: #000; font-weight: bold; font-size: 20px; display: flex; align-items: center; padding-left: 20px; }
        .currency-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 18px; }
    </style>
</head>
<body>
    <div class="grid">
        <div id="radar" style="width: 65%;"><iframe id="windy" style="width:100%; height:100%; border:none;"></iframe></div>
        <div class="sidebar">
            <div id="currencies">Lade Kurse...</div>
            <div id="weather" style="margin-top:20px;">Lade Wetter...</div>
            <div id="alert" style="color:red; font-weight:bold; margin-top:20px;"></div>
        </div>
    </div>
    <div id="ticker" class="ticker">Lade News...</div>

    <script>
        var news = []; var idx = 0;
        function load() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "roskilde_data.json?t=" + new Date().getTime(), true);
            xhr.onreadystatechange = function() {
                if(xhr.readyState == 4 && xhr.status == 200) {
                    var d = JSON.parse(xhr.responseText);
                    // Kurse
                    var cHtml = "";
                    for(var k in d.currencies) { if(!k.includes("trend")) cHtml += "<div class='currency-row'>"+k+": "+d.currencies[k]+" "+d.currencies[k+"_trend"]+"</div>"; }
                    document.getElementById('currencies').innerHTML = cHtml;
                    // Wetter
                    document.getElementById('weather').innerHTML = d.weather.temp + "°C (Gefühlt: " + d.weather.feels_like + "°C)";
                    // News
                    news = d.news;
                    // Alert
                    if(d.alert.active) document.getElementById('alert').innerText = d.alert.message;
                }
            };
            xhr.send();
        }
        setInterval(load, 20000);
        setInterval(function() { if(news.length > 0) { idx = (idx + 1) % news.length; document.getElementById('ticker').innerText = news[idx]; } }, 8000);
        load();
    </script>
</body>
</html>
