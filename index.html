<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ROS KILDE - Infotainment Portal</title>
    <style>
        body { background: #0d0f12; color: #fff; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1a1f26; padding: 15px 20px; font-size: 24px; font-weight: bold; border-bottom: 2px solid #00f2fe; display: flex; justify-content: space-between; }
        .main { display: flex; flex: 1; overflow: hidden; }
        
        /* Das Radar bekommt jetzt die volle Breite und Höhe */
        #windy { width: 65%; height: 100%; border: none; }
        
        .sidebar { width: 35%; padding: 15px; overflow-y: auto; background: #12161c; }
        
        /* Widget-Styling mit deutlichen Trennlinien */
        .widget { border-bottom: 1px solid #343e50; padding-bottom: 15px; margin-bottom: 15px; }
        .widget-title { color: #00f2fe; font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
        
        .currency-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        .flight-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .flight-table td { padding: 6px 0; border-bottom: 1px solid #2d3748; }
        
        .ticker { background: #00f2fe; color: #000; padding: 12px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="header">
        <div>ROS <span style="color:#00f2fe">KILDE</span></div>
        <div style="font-size:14px; opacity:0.7">INFOTAINMENT PORTAL</div>
    </div>

    <div class="main">
        <iframe id="windy" src="https://embed.windy.com/embed2.html?lat=12.923&lon=100.883&zoom=9&overlay=radar&autoplay=true&message=false&marker=false&calendar=false"></iframe>
        
        <div class="sidebar">
            <div class="widget">
                <div class="widget-title">💶 EXCHANGE RATES</div>
                <div id="currencies"></div>
            </div>
            <div class="widget">
                <div class="widget-title">🌡️ WEATHER & WIND</div>
                <div id="weather" style="font-size:14px"></div>
                <div id="alert" style="color:#ff003c; font-weight:bold; margin-top:8px;"></div>
            </div>
            <div class="widget">
                <div id="flight-title" class="widget-title">✈️ FLIGHTS</div>
                <table class="flight-table"><tbody id="flight-table-body"></tbody></table>
            </div>
        </div>
    </div>
    <div id="ticker" class="ticker">Lade News...</div>

    <script>
        var globalData = null;
        var currentFlightType = "ARR";
        var curBlock = 0;

        function load() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "roskilde_data.json?t=" + new Date().getTime(), true);
            xhr.onreadystatechange = function() {
                if(xhr.readyState == 4 && xhr.status == 200) {
                    globalData = JSON.parse(xhr.responseText);
                    render();
                }
            };
            xhr.send();
        }

        function render() {
            if(!globalData) return;
            // Kurse (mit Trennlinien-Logik durch .widget CSS)
            var cHtml = "";
            var keys = Object.keys(globalData.currencies).filter(k => !k.includes("trend"));
            for(var i=0; i<keys.length; i++) {
                var k = keys[i];
                cHtml += "<div class='currency-row'><span>"+k+"/THB</span><span>"+globalData.currencies[k]+" "+globalData.currencies[k+"_trend"]+"</span></div>";
            }
            document.getElementById('currencies').innerHTML = cHtml;
            
            // Wetter
            document.getElementById('weather').innerHTML = "🌡️ " + globalData.weather.temp + "°C (Gefühlt: " + globalData.weather.feels_like + "°C)<br>💨 Wind: " + globalData.weather.wind_speed + " km/h " + globalData.weather.wind_dir;
            if(globalData.alert.active) document.getElementById('alert').innerText = globalData.alert.message;
            
            // Flüge
            document.getElementById('flight-title').innerText = "✈️ FLIGHTS (" + (currentFlightType=="ARR" ? "ARRIVALS" : "DEPARTURES") + ")";
            var fHtml = "";
            for(var i=0; i<globalData.flights.length; i++) {
                var f = globalData.flights[i];
                if(f.type == currentFlightType) fHtml += "<tr><td>"+f.time+"</td><td>"+f.city+"</td><td>"+f.status+"</td></tr>";
            }
            document.getElementById('flight-table-body').innerHTML = fHtml;
        }

        // Radar Rotation (Pattaya <-> Thailand)
        var showPattaya = true;
        setInterval(function() {
            document.getElementById('windy').src = showPattaya ? 
                "https://embed.windy.com/embed2.html?lat=13.000&lon=101.000&zoom=6&overlay=radar&autoplay=true" : 
                "https://embed.windy.com/embed2.html?lat=12.923&lon=100.883&zoom=9&overlay=radar&autoplay=true";
            showPattaya = !showPattaya;
        }, 45000);

        setInterval(function() { currentFlightType = (currentFlightType == "ARR") ? "DEP" : "ARR"; render(); }, 15000);
        setInterval(function() { if(globalData) { var i = Math.floor(Math.random()*globalData.news.length); document.getElementById('ticker').innerText = globalData.news[i]; } }, 8000);
        setInterval(load, 20000);
        load();
    </script>
</body>
</html>
